<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171A; --surface:#1C2024; --surface-2:#23282D; --surface-3:#2A3036;
    --effort:#FF5A36; --effort-dim:#FF5A3630;
    --recovery:#3DDC97; --recovery-dim:#3DDC9730;
    --gold:#F2B705; --gold-dim:#F2B70525;
    --danger:#FF3B3B; --danger-dim:#FF3B3B22;
    --sleep:#8FA8FF;
    --text:#F5F3EF; --text-dim:#9AA0A6; --text-faint:#5B6167; --border:#2C3238;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Sarabun',sans-serif; min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;padding:18px 14px 60px;}
  h1,h2,h3{font-family:'Kanit',sans-serif; margin:0;}

  .top-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; gap:10px;}
  .top-header h1{font-size:19px; font-weight:700;}
  .top-header .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .top-actions{display:flex; gap:8px; align-items:center; flex-shrink:0;}
  .streak-chip{display:flex; align-items:center; gap:5px; background:var(--gold-dim); border:1px solid #F2B70540; padding:8px 12px; border-radius:20px; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; color:var(--gold); white-space:nowrap;}
  .todaybtn{background:var(--effort); color:#fff; border:none; padding:9px 14px; border-radius:10px; font-family:'Kanit',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer; white-space:nowrap;}
  .iconbtn{width:38px;height:38px;border-radius:10px;background:var(--surface); display:flex;align-items:center;justify-content:center;border:1px solid var(--border); cursor:pointer; flex-shrink:0;}
  .iconbtn:active{background:var(--surface-3);}
  .iconbtn svg{width:17px;height:17px;stroke:var(--text-dim);}

  .cal-wrap{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:14px 12px; margin-bottom:16px;}
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 2px;}
  .cal-nav .navbtn{width:30px;height:30px;border-radius:9px;background:var(--surface-2); display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim); border:1px solid var(--border); font-size:16px; user-select:none;}
  .cal-nav .navbtn:active{background:var(--surface-3);}
  .cal-nav .label{font-family:'Kanit',sans-serif; font-weight:700; font-size:15px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cal-dow{text-align:center; font-size:9.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; padding-bottom:6px; font-weight:600;}
  .cal-cell{min-height:58px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border); padding:4px; cursor:pointer; display:flex; flex-direction:column; overflow:hidden;}
  .cal-cell:active{background:var(--surface-3);}
  .cal-cell.empty{visibility:hidden; cursor:default; min-height:0;}
  .cal-cell.future{opacity:0.3; cursor:default;}
  .cal-cell.today2{border-color:var(--effort); border-width:2px;}
  .cal-daynum{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-dim); font-weight:600; margin-bottom:2px;}
  .cal-cell.today2 .cal-daynum{color:var(--effort);}
  .cell-line{font-size:8px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:1px;}
  .cell-line.done{color:var(--recovery); text-decoration:line-through; opacity:0.75;}
  .cell-line.missed{color:var(--danger);}
  .cell-line.pending{color:var(--text-faint);}
  .cell-line.warn{color:var(--gold);}
  .cell-line.rest{color:var(--text-faint); font-style:italic;}
  .cal-legend{display:flex; gap:11px; flex-wrap:wrap; margin-top:12px; font-size:9.5px; color:var(--text-dim);}
  .cal-legend .lg{display:flex; align-items:center; gap:4px;}
  .cal-legend .sw{width:8px;height:8px;border-radius:3px; flex-shrink:0;}

  .section-title{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-faint); margin:20px 0 10px 4px; font-family:'JetBrains Mono',monospace;}
  .sum-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .sum-tab{flex:1; text-align:center; padding:8px; border-radius:10px; font-size:12px; background:var(--surface-2); color:var(--text-dim); cursor:pointer; border:1px solid var(--border);}
  .sum-tab.active{background:var(--effort); color:#fff; border-color:var(--effort);}
  .sum-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sum-stat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px;}
  .sum-stat .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px;}
  .sum-stat .l{font-size:11px; color:var(--text-dim); margin-top:2px;}

  .tip{background:var(--gold-dim); border:1px solid #F2B70540; border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; margin-top:18px;}
  .tip-icon{font-size:18px;}
  .tip-text{font-size:13px; line-height:1.5; color:var(--text);}
  .tip-text b{color:var(--gold);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  .card.done{border-color:var(--recovery);}
  .card-top{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .card-left{display:flex; align-items:center; gap:12px; min-width:0;}
  .qicon{width:36px;height:36px;border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; background:var(--surface-3); flex-shrink:0;}
  .card.done .qicon{background:var(--recovery);}
  .ctitle{font-family:'Kanit',sans-serif; font-weight:600; font-size:14.5px;}
  .csub{font-size:11.5px; color:var(--text-dim); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .qcheck{width:23px;height:23px;border-radius:50%;border:2px solid var(--border); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .card.done .qcheck{background:var(--recovery); border-color:var(--recovery);}
  .qform{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .qform.open{max-height:2400px; margin-top:14px;}
  .qform-inner{padding-top:12px; border-top:1px solid var(--border);}
  .field-row{display:flex; gap:8px; margin-bottom:10px;}
  .field{flex:1; min-width:0;}
  .field label{font-size:11px; color:var(--text-dim); display:block; margin-bottom:5px;}
  .field input{width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:10px; font-size:16px; font-family:'JetBrains Mono',monospace; outline:none;}
  .field input:focus{border-color:var(--effort);}
  .btnrow{display:flex; gap:8px;}
  .btn{flex:1; padding:11px; border-radius:10px; border:none; font-family:'Kanit',sans-serif; font-weight:600; font-size:14px; cursor:pointer;}
  .btn:active{opacity:0.8;}
  .btn-primary{background:var(--effort); color:#fff;}
  .btn-ghost{background:var(--surface-3); color:var(--text-dim); flex:0 0 auto; padding:11px 16px;}
  .rest-toggle{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--surface-2); border-radius:10px; margin-bottom:10px; font-size:13px; color:var(--text-dim);}
  .switch{width:38px;height:22px;border-radius:20px;background:var(--surface-3); position:relative; cursor:pointer; flex-shrink:0;}
  .switch.on{background:var(--recovery);}
  .switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;}
  .switch.on::after{left:18px;}

  .ex-row{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .ex-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .ex-name{font-family:'Kanit',sans-serif; font-weight:600; font-size:13px;}
  .ex-target{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); background:var(--gold-dim); padding:2px 8px; border-radius:20px; flex-shrink:0;}
  .ex-sets{display:flex; gap:6px; flex-wrap:wrap;}
  .ex-set{flex:1; min-width:44px;}
  .ex-set label{display:block; font-size:9px; color:var(--text-faint); text-align:center; margin-bottom:3px; font-family:'JetBrains Mono',monospace;}
  .ex-set input{width:100%; text-align:center; background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:8px 2px; border-radius:8px; font-size:16px; font-family:'JetBrains Mono',monospace; outline:none;}
  .ex-set input:focus{border-color:var(--effort);}

  .meal-item{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .meal-name{flex:1; min-width:0; font-size:13px;}
  .meal-name .mn{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .meal-macro{font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-top:2px;}
  .meal-cal{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; cursor:pointer; flex-shrink:0;}
  .meal-del{width:26px;height:26px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex-shrink:0; cursor:pointer; font-size:14px;}
  .meal-edit-row{display:flex; gap:6px; margin-top:8px;}

  .coach-card{background:linear-gradient(135deg, var(--surface) 0%, #1a1f22 100%); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  .coach-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .coach-avatar{width:34px;height:34px;border-radius:9px; background:var(--gold-dim); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}

  .mini-ring-row{display:flex; justify-content:center; gap:18px; margin-bottom:16px;}
  .mini-ring{position:relative; width:56px; height:56px;}
  .mini-ring svg{width:100%;height:100%;}
  .mini-ring .lbl{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:16px;}

  .weight-row{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
  .weight-big{font-family:'JetBrains Mono',monospace; font-size:30px; font-weight:700;}
  .weight-delta{font-family:'JetBrains Mono',monospace; font-size:13px; padding:3px 8px; border-radius:20px;}
  .weight-delta.down{background:var(--recovery-dim); color:var(--recovery);}
  .weight-delta.up{background:var(--effort-dim); color:var(--effort);}
  .weight-delta.flat{background:var(--surface-3); color:var(--text-dim);}
  .chart-wrap{width:100%; height:64px;}
  .goal-track{height:10px; background:var(--surface-3); border-radius:8px; overflow:hidden;}
  .goal-fill{height:100%; background:linear-gradient(90deg, var(--effort), var(--gold)); border-radius:8px; transition:width .4s ease;}
  .goal-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); margin-top:6px; font-family:'JetBrains Mono',monospace;}
  .bar-row{margin-bottom:12px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;}
  .bar-top .label{color:var(--text-dim);}
  .bar-top .val{font-family:'JetBrains Mono',monospace; color:var(--text);}
  .bar-track{height:8px; background:var(--surface-3); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:6px; transition:width .4s ease;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px); display:none; align-items:flex-end; z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--bg); width:100%; max-width:520px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px 16px 24px; max-height:92vh; overflow-y:auto; transform:translateY(100%); transition:transform .25s ease;}
  .overlay.show .modal{transform:translateY(0);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .modal-title{font-family:'Kanit',sans-serif; font-weight:700; font-size:17px;}
  .modal-close{width:30px;height:30px;border-radius:50%;background:var(--surface-2); display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim); font-size:16px; flex-shrink:0;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-3); color:var(--text); padding:10px 18px; border-radius:30px; font-size:13px; opacity:0; transition:all .25s; z-index:60; pointer-events:none; border:1px solid var(--border); max-width:85%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .loading{display:flex; align-items:center; justify-content:center; min-height:80vh; color:var(--text-dim);}
  ::selection{background:var(--effort); color:#fff;}

  /* Exercise / food library */
  .lib-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:14px; -webkit-overflow-scrolling:touch;}
  .lib-tabs::-webkit-scrollbar{display:none;}
  .lib-tab{flex:0 0 auto; padding:8px 14px; border-radius:20px; font-size:12.5px; background:var(--surface-2); color:var(--text-dim); cursor:pointer; border:1px solid var(--border); white-space:nowrap;}
  .lib-tab.active{background:var(--effort); color:#fff; border-color:var(--effort);}
  .lib-ex-card{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;}
  .lib-ex-name{font-family:'Kanit',sans-serif; font-weight:600; font-size:14.5px; margin-bottom:6px;}
  .lib-ex-tip{font-size:12px; color:var(--text-dim); line-height:1.6; display:flex; gap:6px; margin-bottom:3px;}
  .lib-ex-tip:last-child{margin-bottom:0;}
  .lib-ex-tip .bullet{color:var(--gold); flex-shrink:0;}
  .lib-food-item{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .lib-food-name{flex:1; min-width:0; font-size:13px; font-weight:600;}
  .lib-food-cal{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--gold); flex-shrink:0; white-space:nowrap;}
  .lib-food-add{width:30px;height:30px;border-radius:50%; background:var(--effort); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex-shrink:0;}
  .lib-food-cat-title{font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:1px; margin:16px 0 8px 2px;}
  .lib-food-cat-title:first-child{margin-top:0;}

  /* ---------- Responsive scaling: tablet ---------- */
  @media (min-width: 700px){
    #app{max-width:680px; padding:28px 24px 60px;}
    .top-header h1{font-size:23px;}
    .top-header .sub{font-size:13px;}
    .streak-chip{font-size:14px; padding:9px 14px;}
    .todaybtn{font-size:14px; padding:11px 16px;}
    .iconbtn{width:42px;height:42px;}
    .iconbtn svg{width:19px;height:19px;}
    .cal-wrap{padding:20px 18px; border-radius:24px;}
    .cal-nav .label{font-size:17px;}
    .cal-nav .navbtn{width:34px;height:34px; font-size:18px;}
    .cal-dow{font-size:11px;}
    .cal-cell{min-height:80px; border-radius:11px; padding:7px;}
    .cal-daynum{font-size:13px;}
    .cell-line{font-size:10.5px; line-height:1.5;}
    .cal-legend{font-size:11px; gap:16px;}
    .cal-legend .sw{width:9px;height:9px;}
    .section-title{font-size:13px;}
    .sum-stat .n{font-size:23px;}
    .sum-stat .l{font-size:12px;}
    .sum-stat{padding:16px 18px;}
    .tip-text{font-size:14px;}
    .ctitle{font-size:16px;}
    .csub{font-size:12.5px;}
    .field input{font-size:16px;}
    .btn{font-size:15px;}
    .mini-ring{width:66px; height:66px;}
    .mini-ring .lbl{font-size:19px;}
    .meal-name{font-size:14px;}
    .meal-cal{font-size:16px;}
    .coach-card{padding:20px;}
  }

  /* ---------- Responsive scaling: desktop ---------- */
  @media (min-width: 1024px){
    body{display:flex; justify-content:center;}
    #app{max-width:860px; padding:36px 32px 70px;}
    .top-header h1{font-size:26px;}
    .cal-wrap{padding:24px 22px;}
    .cal-cell{min-height:96px; padding:9px;}
    .cal-daynum{font-size:14px;}
    .cell-line{font-size:11.5px;}
    .cal-nav .label{font-size:19px;}
    .sum-grid{grid-template-columns:repeat(4,1fr);}
    .sum-stat .n{font-size:25px;}

    /* Day-detail & settings become centered dialogs instead of mobile bottom sheets */
    .overlay{align-items:center; padding:24px;}
    .modal{border-radius:22px; max-width:560px; max-height:88vh; transform:translateY(16px) scale(0.98); opacity:0; transition:transform .2s ease, opacity .2s ease;}
    .overlay.show .modal{transform:translateY(0) scale(1); opacity:1;}
    .modal-title{font-size:19px;}
    .ex-set input, .field input{font-size:16px;}
  }

  /* ---------- Very narrow phones: tighten calendar so nothing clips ---------- */
  @media (max-width: 359px){
    #app{padding:16px 10px 60px;}
    .cal-grid{gap:2px;}
    .cal-cell{min-height:52px; padding:3px;}
    .cell-line{font-size:7.3px;}
    .cal-daynum{font-size:9.5px;}
  }

  /* Hover affordances for pointer devices only (doesn't affect touch) */
  @media (min-width:700px) and (hover:hover){
    .cal-cell:hover{border-color:var(--effort);}
    .todaybtn:hover, .btn:hover{opacity:0.9;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading">กำลังโหลด...</div></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="settingsOverlay" onclick="if(event.target===this)closeModal('settingsOverlay')">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">ตั้งค่าโปรไฟล์</div><div class="modal-close" onclick="closeModal('settingsOverlay')">✕</div></div>
    <div class="field-row">
      <div class="field"><label>น้ำหนักเริ่มต้น (กก.)</label><input type="number" id="setStart" step="0.1" oninput="updateGoalsPreview()"></div>
      <div class="field"><label>เป้าหมาย (กก.)</label><input type="number" id="setGoal" step="0.1"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>ส่วนสูง (ซม.)</label><input type="number" id="setHeight" oninput="updateGoalsPreview()"></div>
      <div class="field"><label>อายุ</label><input type="number" id="setAge" oninput="updateGoalsPreview()"></div>
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label>ระดับกิจกรรม</label>
      <select id="setActivity" onchange="updateGoalsPreview()">
        <option value="1.375">น้อย — ออกกำลังกาย 1-3 วัน/สัปดาห์</option>
        <option value="1.55">ปานกลาง — ออกกำลังกาย 3-5 วัน/สัปดาห์</option>
        <option value="1.725">มาก — ออกกำลังกาย 6-7 วัน/สัปดาห์</option>
      </select>
    </div>
    <div id="goalsPreview" style="background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:var(--text-dim);"></div>
    <div style="font-size:10.5px; color:var(--text-faint); margin:-8px 0 14px;">แคลอรี่และโปรตีนเป้าหมายคำนวณอัตโนมัติจากน้ำหนักล่าสุด ส่วนสูง อายุ และระดับกิจกรรม — จะอัปเดตทุกครั้งที่บันทึกน้ำหนักใหม่</div>
    <div class="btnrow" style="margin-top:6px;">
      <button class="btn btn-ghost" onclick="closeModal('settingsOverlay')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveSettings()">บันทึก</button>
    </div>
  </div>
</div>

<div class="overlay" id="exerciseLibOverlay" style="z-index:60;" onclick="if(event.target===this)closeModal('exerciseLibOverlay')">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">คลังท่าออกกำลังกาย</div><div class="modal-close" onclick="closeModal('exerciseLibOverlay')">✕</div></div>
    <div id="exerciseLibBody"></div>
  </div>
</div>

  const days=["อา","จ","อ","พ","พฤ","ศ","ส"];
  const months=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const d=new Date(iso+"T00:00:00");
  return `วัน${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}
function esc(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let DATA = null;

let openForm = null;

async function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) throw new Error("no saved data yet");
    DATA = JSON.parse(raw);
  }catch(e){
    DATA = { profile:{startWeight:93, goalWeight:85, height:185, age:22, activityMultiplier:1.55, calorieGoal:2550, proteinGoal:190}, days:{} };
  }
  if(!DATA.days) DATA.days = {};
  if(!DATA.profile) DATA.profile = {startWeight:93, goalWeight:85, height:185, age:22, activityMultiplier:1.55, calorieGoal:2550, proteinGoal:190};
  if(!DATA.profile.height) DATA.profile.height = 185;
  if(!DATA.profile.age) DATA.profile.age = 22;
  if(!DATA.profile.activityMultiplier) DATA.profile.activityMultiplier = 1.55;
}
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
    catch(e){ console.error("save failed", e); showToast("บันทึกไม่สำเร็จ — พื้นที่จัดเก็บอาจเต็ม"); }
  }, 250);
}
function getDay(iso){
  if(!DATA.days[iso]) DATA.days[iso] = {weight:null, waist:null, restDay:false, workoutSubmitted:false, exerciseLog:{}, meals:[], sleepHours:null};
  const d = DATA.days[iso];
  if(!d.exerciseLog) d.exerciseLog = {};
  if(!d.meals) d.meals = [];
  return d;
}

function planFor(iso){ return WORKOUT_PLAN[new Date(iso+'T00:00:00').getDay()]; }

// Progressive overload — auto-raises an exercise's target once the base target has been
// hit on 2 consecutive weekly occurrences. Purely computed from logged history each call
// (nothing stored/mutated), so backfilling or correcting a past entry recalculates cleanly
// with no drift.
const PROGRESSION_STEP = {reps:1, minutes:2, seconds:5};
function hitsTarget(sets, target){
  return !!(sets && sets.length && sets.every(v=>v>=target));
}
function computeCurrentTarget(dow, i, beforeIso){
  const ex = WORKOUT_PLAN[dow].exercises[i];
  const step = PROGRESSION_STEP[ex.type] || 1;
  // Walk this exercise's past occurrences (same weekday, strictly before the day being
  // viewed) oldest-to-newest, simulating the target as it would have moved over time —
  // each occurrence is checked against whatever the target actually was at that point,
  // not the flat original base (otherwise one lucky week above base would grant free
  // bumps forever). A miss pauses progression but never claws back an earned bump.
  const occ = Object.keys(DATA.days)
    .filter(iso => iso < beforeIso && new Date(iso+'T00:00:00').getDay()===dow)
    .sort()
    .map(iso => DATA.days[iso].exerciseLog && DATA.days[iso].exerciseLog[i])
    .filter(sets => sets && sets.length);
  let target = ex.target;
  let consecutiveHits = 0;
  for(const sets of occ){
    if(hitsTarget(sets, target)){
      consecutiveHits++;
      if(consecutiveHits % 2 === 0 && (consecutiveHits/2) <= 20) target += step; // sane ceiling
    } else {
      consecutiveHits = 0;
    }
  }
  return {target, streak: consecutiveHits % 2};
}
function isoPlusOne(iso){ const dt=new Date(iso+'T00:00:00'); dt.setDate(dt.getDate()+1); return isoLocal(dt); }

function workoutDoneFlag(d){ return !!(d.restDay || d.workoutSubmitted || d.workoutDone || (d.customExercises && d.customExercises.length>0)); }
function caloriesTotal(d){
  if(d.meals && d.meals.length) return d.meals.filter(m=>!m.pending).reduce((s,m)=>s+(m.calories||0),0);
  return d.calories!=null ? d.calories : null;
}
function proteinTotal(d){
  if(d.meals && d.meals.length) return d.meals.filter(m=>!m.pending).reduce((s,m)=>s+(m.protein||0),0);
  return d.protein!=null ? d.protein : null;
}
function mealsLogged(d){ return (d.meals && d.meals.some(m=>!m.pending)) || d.calories!=null; }
function isDayComplete(d){ return !!(d.weight!=null && workoutDoneFlag(d) && mealsLogged(d)); }
function completionCount(d){ let n=0; if(d.weight!=null)n++; if(workoutDoneFlag(d))n++; if(mealsLogged(d))n++; return n; }
function calorieStatus(d){
  const cal = caloriesTotal(d); if(cal==null) return null;
  const goal = DATA.profile.calorieGoal, over = cal-goal;
  if(over > goal*0.10) return {state:'over', diff:Math.round(over)};
  if(over < -goal*0.20) return {state:'under', diff:Math.round(Math.abs(over))};
  return {state:'ontrack', diff:Math.round(over)};
}
function computeStreak(){
  let streak=0, cursor=todayStr(0), d=DATA.days[cursor];
  let offset=(!d||!isDayComplete(d))?-1:0;
  while(true){ const iso=todayStr(offset); const dd=DATA.days[iso]; if(dd&&isDayComplete(dd)){streak++;offset--;} else break; if(streak>400)break; }
  return streak;
}

function getLatestWeight(){
  const sortedDays = Object.keys(DATA.days).sort();
  const series = sortedDays.map(k=>DATA.days[k].weight).filter(v=>v!=null);
  return series.length ? series[series.length-1] : DATA.profile.startWeight;
}
// Recalculates calorie/protein targets from the latest known weight + height/age/activity (Mifflin-St Jeor, ~500kcal deficit).
// Called whenever a new weight is logged, or height/age/activity settings change.
function recalcGoals(){
  const w = getLatestWeight();
  const h = DATA.profile.height || 175;
  const age = DATA.profile.age || 25;
  const act = DATA.profile.activityMultiplier || 1.55;
  const bmr = 10*w + 6.25*h - 5*age + 5; // Mifflin-St Jeor (male)
  const tdee = bmr * act;
  DATA.profile.calorieGoal = Math.max(1200, Math.round((tdee-500)/10)*10);
  DATA.profile.proteinGoal = Math.round(w*2);
}

function addMeal(){

  if(!cal || cal<=0){ showToast("กรอกแคลอรี่ของเมนูนี้ก่อนนะ"); return; }

function submitWorkout(){
  const iso=activeDate; const d=getDay(iso);
  let leveledUp = [];
  if(!d.restDay){
    const plan=planFor(iso); const dow=new Date(iso+'T00:00:00').getDay(); const log={}; let anyFilled=false;
    const beforeTargets = plan.exercises.map((ex,i)=>computeCurrentTarget(dow,i,iso).target);
    plan.exercises.forEach((ex,i)=>{
      const arr=[];
      for(let s=0;s<ex.sets;s++){
        const el=document.getElementById(`exset_${i}_${s}`);
        const v=el?parseFloat(el.value):NaN;
        arr.push(isNaN(v)?0:v);
        if(!isNaN(v)&&v>0) anyFilled=true;
      }
      log[i]=arr;
    });
    if(!anyFilled){ showToast("กรอกจำนวนที่ทำจริงอย่างน้อย 1 ท่าก่อนนะ"); return; }
    d.exerciseLog=log; d.workoutSubmitted=true;
    // Level-up = the target computed as of "the day after" (which now includes today's
    // freshly-saved log) is higher than the target that applied going into today.
    const afterIso = isoPlusOne(iso);
    plan.exercises.forEach((ex,i)=>{
      const afterTarget = computeCurrentTarget(dow,i,afterIso).target;
      if(afterTarget > beforeTargets[i]) leveledUp.push(`${ex.name} → ${ex.sets}×${afterTarget} ${unitLabel[ex.type]}`);
    });
  }
  persist(); openForm=null;
  if(leveledUp.length){
    showToast(`🎉 เพิ่มเป้าหมายอัตโนมัติ: ${leveledUp.join(', ')}`);
  } else {
    showToast(d.restDay ? "พักผ่อนก็สำคัญ บันทึกแล้ว 🌿" : "เยี่ยม! บันทึกการฝึกแล้ว 🔥");
  }
  refresh(true);
}

// Rule-based daily insight — no network call, works fully offline/standalone.
function generateInsight(iso, d, plan, streak){
  const lines = [];
  if(d.weight==null){
    lines.push({icon:'⚖️', text:'ยังไม่ได้ชั่งน้ำหนักวันนี้ — บันทึกไว้เพื่อดูเทรนด์ระยะยาวได้แม่นยำขึ้น'});
  }
  if(plan.exercises.length===0){
    lines.push({icon:'🌿', text:'วันนี้เป็นวันพักตามแผน พักผ่อนให้เต็มที่'});
  } else if(d.restDay){
    lines.push({icon:'🌿', text:'บันทึกเป็นวันพักแทนโปรแกรมเดิม ร่างกายได้ฟื้นตัว'});
  } else if(!d.workoutSubmitted){
    lines.push({icon:'🏋️', text:`วันนี้มีโปรแกรม "${plan.label}" รออยู่ ${plan.exercises.length} ท่า`});
  } else {
    lines.push({icon:'🔥', text:'บันทึกผลการฝึกตามแผนแล้ว ทำได้ดีมาก'});
  }
  const cs = calorieStatus(d);
  if(!cs){
    lines.push({icon:'🍽️', text:'ยังไม่ได้บันทึกมื้ออาหารวันนี้'});
  } else if(cs.state==='over'){
    lines.push({icon:'⚠️', text:`วันนี้กินเกินเป้าไป ${cs.diff} kcal ลองปรับมื้อถัดไปให้เบาลงหน่อย`});
  } else if(cs.state==='under'){
    lines.push({icon:'⚠️', text:'วันนี้กินต่ำกว่าเป้าค่อนข้างมาก ระวังอย่าจำกัดจนเกินไป'});
  } else {
    lines.push({icon:'✅', text:'แคลอรี่วันนี้อยู่ในเป้าหมาย เยี่ยมมาก'});
  }
  if(d.sleepHours!=null){
    if(d.sleepHours<6) lines.push({icon:'😴', text:`นอนแค่ ${d.sleepHours} ชม. — พยายามนอนให้ได้ 7-8 ชม. เพื่อการฟื้นตัวที่ดีขึ้น`});
    else lines.push({icon:'😴', text:`นอน ${d.sleepHours} ชม. เพียงพอดี`});
  }
  if(streak>=3) lines.push({icon:'🔥', text:`ทำต่อเนื่องมาแล้ว ${streak} วัน อย่าให้สายขาดนะ!`});
  return lines;
}

  const w = getLatestWeight();
  const h = parseFloat(document.getElementById('setHeight').value)||DATA.profile.height||175;
  const age = parseFloat(document.getElementById('setAge').value)||DATA.profile.age||25;

  const bmr = 10*w + 6.25*h - 5*age + 5;

}

function ringSvgMini(pct, color){
  const r=24, c=2*Math.PI*r, dash=c*pct;
  return `<svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="6"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 28 28)"/></svg>`;
}
function sparkline(values){
  if(values.length<2) return `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-faint);font-size:12px;">บันทึกน้ำหนักอีก ${2-values.length} ครั้งเพื่อดูกราฟ</div>`;
  const w=300,h=64,pad=6;
  const min=Math.min(...values), max=Math.max(...values), range=(max-min)||1;
  const step=(w-2*pad)/(values.length-1);
  const pts=values.map((v,i)=>[pad+i*step, pad+(1-((v-min)/range))*(h-2*pad)]);
  const path=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  const areaPath = path+` L${last[0]},${h} L${pts[0][0]},${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none">
    <defs><linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF5A36" stop-opacity="0.35"/><stop offset="100%" stop-color="#FF5A36" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaPath}" fill="url(#grad1)" stroke="none"/>
    <path d="${path}" fill="none" stroke="#FF5A36" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#FF5A36"/>
  </svg>`;
}

function renderDayDetail(iso, pulse){
  const today = todayStr(0);
  const isEditingPast = iso !== today;
  const d = getDay(iso);
  const plan = planFor(iso);
  const cc = completionCount(d);

function cellContentHtml(iso, dd, today){
  const plan = planFor(iso);
  const isPast = iso < today;
  let lines = [];
  if(plan.exercises.length===0){
    if(dd && dd.customExercises && dd.customExercises.length>0){
      lines.push(`<div class="cell-line done">ออกกำลังกาย</div>`);
    } else {
      lines.push(`<div class="cell-line rest">พักตามแผน</div>`);
    }
  } else {
    const wDone = dd && workoutDoneFlag(dd);
    const cls = wDone ? 'done' : (isPast ? 'missed' : 'pending');
    lines.push(`<div class="cell-line ${cls}">${esc(plan.short)}</div>`);
  }
  const cal = dd ? caloriesTotal(dd) : null;
  if(cal!=null){
    const cs = calorieStatus(dd);
    const cls = (cs && cs.state==='over') ? 'warn' : 'done';
    lines.push(`<div class="cell-line ${cls}">${cal} kcal</div>`);
  } else if(isPast){
    lines.push(`<div class="cell-line missed">ไม่ได้กิน</div>`);
  }
  return lines.join('');
}
function navMonth(delta){ calMonthOffset += delta; renderCalendarMain(); }
function setSummaryRange(days){ summaryRange = days; renderCalendarMain(); }
function average(arr){ if(!arr.length) return null; return arr.reduce((a,b)=>a+b,0)/arr.length; }

function buildRangeStats(rangeDays){
  const entries=[];
  for(let i=0;i<rangeDays;i++){
    const iso=todayStr(-i); const d=DATA.days[iso];
    if(d && (d.weight!=null||workoutDoneFlag(d)||mealsLogged(d))) entries.push([iso,d]);
  }
  entries.sort((a,b)=> a[0]<b[0]?1:-1);
  const weights = entries.filter(([,d])=>d.weight!=null).map(([,d])=>d.weight);
  const avgCal = average(entries.map(([,d])=>caloriesTotal(d)).filter(v=>v!=null));
  const avgProt = average(entries.map(([,d])=>proteinTotal(d)).filter(v=>v!=null));
  const completeDays = entries.filter(([,d])=>isDayComplete(d)).length;
  const weightChange = weights.length>=2 ? (weights[0]-weights[weights.length-1]) : null;
  return {entries, avgCal, avgProt, completeDays, weightChange};
}

// How closely actual logged days matched the assigned program over the range.
function buildAdherence(rangeDays){
  let plannedWorkoutDays=0, workoutHits=0, calHits=0, sleepSum=0, sleepCount=0;
  for(let i=0;i<rangeDays;i++){
    const iso = todayStr(-i);
    const d = DATA.days[iso];
    const plan = planFor(iso);
    if(plan.exercises.length>0){
      plannedWorkoutDays++;
      if(d && workoutDoneFlag(d)) workoutHits++;
    }
    if(d){
      const cs = calorieStatus(d);
      if(cs && cs.state==='ontrack') calHits++;
      if(d.sleepHours!=null){ sleepSum+=d.sleepHours; sleepCount++; }
    }
  }
  return {
    workoutPct: plannedWorkoutDays ? Math.round(workoutHits/plannedWorkoutDays*100) : 0,
    calPct: Math.round(calHits/rangeDays*100),
    avgSleep: sleepCount ? sleepSum/sleepCount : null
  };
}

        </div>
        <div class="iconbtn" onclick="openSettings()" title="ตั้งค่า">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </div>
      </div>
    </div>
    <div style="margin-bottom:14px;"><button class="todaybtn" style="width:100%;" onclick="openDayDetail('${today}')">📍 เปิดข้อมูลวันนี้ (${fmtDateTH(today)})</button></div>

    <div class="cal-wrap">
      <div class="cal-nav">
        <div class="navbtn" onclick="navMonth(-1)">‹</div>
        <div class="label">${monthNames[month]} ${year+543}</div>
        <div class="navbtn" onclick="navMonth(1)">›</div>
      </div>
      <div class="cal-grid">
        <div class="cal-dow">อา</div><div class="cal-dow">จ</div><div class="cal-dow">อ</div><div class="cal-dow">พ</div><div class="cal-dow">พฤ</div><div class="cal-dow">ศ</div><div class="cal-dow">ส</div>
        ${cells}
      </div>
      <div class="cal-legend">
        <div class="lg"><span class="sw" style="background:var(--recovery)"></span>ทำครบ (ขีดฆ่า)</div>
        <div class="lg"><span class="sw" style="background:var(--gold)"></span>เกินเป้าแคลอรี่</div>
        <div class="lg"><span class="sw" style="background:var(--danger)"></span>พลาดไป</div>
        <div class="lg"><span class="sw" style="background:var(--text-faint)"></span>ยังไม่ถึง/รอทำ</div>
      </div>
    </div>

    <div class="section-title">สรุปความคืบหน้า</div>
    <div class="sum-tabs">
      <div class="sum-tab ${summaryRange===7?'active':''}" onclick="setSummaryRange(7)">7 วัน</div>
      <div class="sum-tab ${summaryRange===30?'active':''}" onclick="setSummaryRange(30)">30 วัน</div>
      <div class="sum-tab ${summaryRange===90?'active':''}" onclick="setSummaryRange(90)">90 วัน</div>
    </div>
    <div class="sum-grid">
      <div class="sum-stat"><div class="n" style="color:${changeColor}">${changeTxt}</div><div class="l">น้ำหนักเปลี่ยนแปลง</div></div>
      <div class="sum-stat"><div class="n">${s.completeDays}/${summaryRange}</div><div class="l">วันที่ครบ 3 อย่าง</div></div>
      <div class="sum-stat"><div class="n">${s.avgCal?Math.round(s.avgCal):'-'}</div><div class="l">แคลอรี่เฉลี่ย/วัน</div></div>
      <div class="sum-stat"><div class="n">${s.avgProt?Math.round(s.avgProt):'-'}</div><div class="l">โปรตีนเฉลี่ย (ก.)</div></div>
    </div>

    <div class="section-title">ความสม่ำเสมอตามโปรแกรม</div>
    <div class="card">
      <div class="bar-row">
        <div class="bar-top"><span class="label">ออกกำลังกายตามแผนที่วางไว้</span><span class="val">${adh.workoutPct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${adh.workoutPct}%; background:var(--recovery);"></div></div>
      </div>
      <div class="bar-row" style="${adh.avgSleep==null?'margin-bottom:0;':''}">
        <div class="bar-top"><span class="label">กินอยู่ในเป้าแคลอรี่</span><span class="val">${adh.calPct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${adh.calPct}%; background:var(--gold);"></div></div>
      </div>
      ${adh.avgSleep!=null?`<div class="bar-row" style="margin-bottom:0;">
        <div class="bar-top"><span class="label">ชั่วโมงนอนเฉลี่ย</span><span class="val">${adh.avgSleep.toFixed(1)} ชม.</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(adh.avgSleep/8*100,100)}%; background:var(--sleep);"></div></div>
      </div>`:''}
    </div>

    <div class="tip"><div class="tip-icon">💡</div><div class="tip-text">${tip}</div></div>
  `;
}

(async function init(){
  await loadData();
  renderCalendarMain();
})();
</script>
</body>
</html>
